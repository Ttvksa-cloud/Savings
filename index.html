/* additions: pieces the supplied stylesheet does not cover */
:root{color-scheme:light}
html{scroll-behavior:smooth}
.backup button,.backup .text-button{margin:0;display:inline-flex;align-items:center;gap:7px;color:#c9a8ff;font-size:12px}
.backup{margin-top:10px}
.sidebar nav button{width:100%}
@media(min-width:761px){.mobile-tools{display:none}}
.topbar-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar .sound-toggle,.topbar .secondary{display:inline-flex;align-items:center;gap:7px}
.subtabs{overflow-x:auto;scrollbar-width:none}
.subtabs button{white-space:nowrap}
.task-row.is-na .task-toggle{opacity:.5}
.task-row .task-toggle{min-width:0;flex:1}
.water-buttons{flex-wrap:wrap}
.water-buttons button{flex:1 1 calc(25% - 8px);min-width:0}
.water-buttons button:disabled{opacity:.6}
.legend span:first-child i{background:#b58cff}
.legend span:nth-child(2) i{background:rgba(145,100,255,.16)}
.chart-day{cursor:pointer}
.chart-day.today small{color:#efeafc;font-weight:700}
.calendar-strip button{flex-shrink:0}
.calendar-strip .future:not(.current) b{opacity:.7}
input[type=time]{direction:ltr;text-align:center;font-family:Tajawal,sans-serif}
.number-field input[type=time]{font-size:18px}
.number-field>span{display:block}
.modal{width:min(480px,100%);max-height:calc(100vh - 40px);overflow:auto}
.modal .field-label input,.modal .field-label textarea{margin-top:8px}
.modal textarea{line-height:1.5;font-size:12px}
.quote{font-weight:500}
.future-note{margin-bottom:18px}
.storage-warn{margin-bottom:0}
.ai-status{font-size:12px;color:#c9a8ff;margin-top:10px;line-height:1.8}
.nutrition-total .ai-button{flex-shrink:0}
.estimate .secondary{margin-top:10px;padding:9px 12px;font-size:12px}
.pin-error{color:#ff6b8f;margin-top:12px;font-size:13px}
.lace-lock .text-button{display:inline-block}
.sleep-fields .number-field input{font-size:18px}
.workout-heading strong{font-size:15px}
.hero h1 span.when{color:#c9a8ff;font-weight:400;font-size:.72em;display:block}
.chart-card .chart{padding-bottom:2px}
.savebar .secondary{width:100%;padding:12px}
.mobile-tools button{display:inline-flex;align-items:center;gap:7px}
.session-check{text-align:center}
.checkbox svg{display:block}
.meal-box label{display:block;font-weight:700}
.empty-line{color:#c9a8ff;font-size:13px;line-height:1.9}
.guide-steps{margin:0;padding-right:22px}
@media(max-width:760px){
  .content{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
  .subtabs{gap:14px}
  .water-buttons button{padding:12px 6px}
  .monthly-head{flex-wrap:wrap}
  .topbar-tools{width:100%;justify-content:space-between}
  .nutrition-total .ai-button{width:100%;justify-content:center}
}
@media(min-width:761px){.water-card .water-buttons button{flex-basis:calc(12.5% - 8px)}}

/* --- motion: animate on navigation only, never on every tick --- */
@property --progress{syntax:'<percentage>';inherits:true;initial-value:0%}
.ring{transition:--progress .7s cubic-bezier(.2,.7,.2,1)}
@keyframes slide-up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes rowflash{0%{box-shadow:0 0 0 0 rgba(0,0,0,.4)}100%{box-shadow:0 0 0 14px #d58fb300}}
@keyframes toast-up{0%{opacity:0;transform:translate(-50%,24px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,10px)}}
.content>.hero,.clock-ribbon,.calendar-strip,.overview,.content .card{animation:none}
.content.enter>.hero{animation:slide-up .5s ease-out both}
.content.enter .clock-ribbon{animation:slide-up .5s .05s ease-out both}
.content.enter .calendar-strip{animation:slide-up .5s .1s ease-out both}
.content.enter .overview{animation:slide-up .5s .15s ease-out both}
.content.enter .card,.content.enter-cards .card{animation:slide-up .45s ease-out both}
.content.enter .card:nth-child(2),.content.enter-cards .card:nth-child(2){animation-delay:.06s}
.content.enter .card:nth-child(3),.content.enter-cards .card:nth-child(3){animation-delay:.12s}
.content.enter .card:nth-child(4),.content.enter-cards .card:nth-child(4){animation-delay:.18s}
.content.enter .card:nth-child(n+5),.content.enter-cards .card:nth-child(n+5){animation-delay:.24s}
.modal-backdrop{animation:fade-in .2s ease-out}
.modal{animation:slide-up .3s ease-out}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;z-index:30;max-width:min(92vw,420px);background:#9146ff;color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:none;text-align:center}
.toast.show{animation:toast-up 2s ease-out forwards}

/* --- checklist interactions --- */
.checkbox{position:relative;transition:background .2s,border-color .2s,transform .15s}
.done .checkbox svg{animation:none}
.checkbox.fx-on svg{animation:check-pop .35s ease-out}
.checkbox.fx-on:after{left:-19px;top:-6px;width:61px;text-align:center;font-size:15px}
.task-toggle:active .checkbox,.session-check:active .checkbox{transform:scale(.86)}
.task-row{border-radius:10px;padding:5px 6px;margin:-5px -6px;transition:background .15s}
.task-row:hover{background:rgba(40,30,72,0.6)}
.task-row.fx-row,.session.fx-row{animation:rowflash .8s ease-out}
.task-row.done .lbl{text-decoration:line-through;text-decoration-color:#c9a8ff;text-decoration-thickness:2px;color:#c9a8ff}
.task-row .task-toggle>span{min-width:0}
.row-actions{display:flex;align-items:center;gap:2px;flex-shrink:0}
.rm-task{display:grid;place-items:center;padding:6px;border-radius:7px;color:#c9a8ff}
.rm-task:hover{color:#ff6b8f;background:rgba(30,24,54,.55)}
.add-task{display:flex;gap:8px;margin-top:18px}
.add-task input{flex:1;min-width:0;padding:10px 12px;font-size:14px}
.add-task .secondary{flex-shrink:0;padding:10px 14px}
.session{transition:background .2s,border-color .2s}

/* --- layout fixes --- */
.number-field>div{padding-left:0;overflow:hidden}
.number-field input{flex:1 1 auto;width:auto;min-width:0}
.number-field small{flex-shrink:0;white-space:nowrap;padding:0 12px 0 10px}
.workout-time .number-field>div{max-width:100%}
.workout-time{align-items:start}
.workout-time>.number-field:first-child{align-self:stretch}
.duration-readout{align-self:stretch}
.demo-banner+.hero{margin-top:36px}
.hero h1{overflow-wrap:anywhere}
.explanation li{overflow-wrap:anywhere}
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}


.wx{display:block;margin:0 0 4px;font-weight:700;color:#c9a8ff}.leftline{display:block}.clock-ribbon small{font-size:18px!important;font-weight:700;display:block;margin-top:4px}
.add-row{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}.add-row input{flex:1;min-width:120px;width:auto}.add-row select{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(40,30,72,0.6);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:5px 6px 5px 12px;font-size:13px;color:#6fb3ff}.chip button{display:flex;padding:3px;color:#6fb3ff}
.water-card progress,.phone-card progress,.goals-card progress{width:100%;height:8px;-webkit-appearance:none;appearance:none;margin-top:8px}.water-card progress::-webkit-progress-bar,.phone-card progress::-webkit-progress-bar,.goals-card progress::-webkit-progress-bar{background:rgba(40,30,72,0.6);border-radius:9px}.goals-card progress::-webkit-progress-value{background:linear-gradient(90deg,#9146ff,#ff4fa3);border-radius:9px}.water-card progress::-webkit-progress-value{background:#3a86ff;border-radius:9px}.phone-card progress::-webkit-progress-value,.goals-card progress::-webkit-progress-value{background:#b58cff;border-radius:9px}
.media-row{display:grid;grid-template-columns:1.5fr 1fr auto;gap:12px;align-items:end;padding:12px 0;border-bottom:1px dashed rgba(255,255,255,.12)}.media-name{display:flex;gap:6px}.media-name select{width:96px;flex:none}
.care-row,.tx{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0}.tx{border-bottom:1px dashed rgba(255,255,255,.12);font-size:14px}.tx span{flex:1;overflow-wrap:anywhere}.tx small{color:#a9a3c4}.tx.in b{color:#4ee6a8}.tx.out b{color:#ff6b8f}.tx button,.ev button{display:flex;padding:4px;color:#c9a8ff}

s-soon:hover, .badge-card.status-unavailable:hover {\n        border-color: rgb(var(--st));\n        background: linear-gradient(160deg, rgba(var(--st), 0.3), rgba(22, 18, 36, 0.6) 70%);\n        box-shadow: 0 15px 35px -5px rgba(var(--st), 0.45), inset 0 1px 1px 0 rgba(255, 255, 255, 0.2);\n    }\n    .badge-card.status-available .shadow-badge-glow, .badge-card.status-soon .shadow-badge-glow, .badge-card.status-unavailable .shadow-badge-glow {\n        border-color: rgba(var(--st), 0.5);\n        box-shadow: 0 0 25px rgba(var(--st), 0.45);\n    }\n    .badge-card.status-available:hover h3, .badge-card.status-soon:hover h3, .badge-card.status-unavailable:hover h3 { color: rgb(var(--st)) !important; }\n\n    #badge-detail-modal[data-status] { background: radial-gradient(circle at 50% 40%, rgba(var(--st), 0.28), rgba(0, 0, 0, 0.88) 70%); }\n    #badge-detail-modal[data-status] > div {\n        border-color: rgba(var(--st), 0.6);\n        background: linear-gradient(160deg, rgba(var(--st), 0.22), rgba(14, 11, 24, 0.92) 60%);\n        box-shadow: 0 20px 60px rgba(var(--st), 0.3);\n    }\n    #badge-detail-modal[data-status] .badge-display-frame {\n        background: radial-gradient(circle at center, rgba(var(--st), 0.3) 0%, rgba(0, 0, 0, 0.6) 100%);\n        border-color: rgba(var(--st), 0.45);\n        box-shadow: inset 0 0 15px rgba(var(--st), 0.3);\n    }\n    #badge-detail-modal[data-status] #detail-image-box { border-color: rgba(var(--st), 0.6); box-shadow: 0 0 25px rgba(var(--st), 0.5); }\n    #badge-detail-modal[data-status] #detail-code { color: rgb(var(--st)); }\n    #badge-detail-modal[data-status] .ios-button { background: rgb(var(--st)); color: var(--stt); }\n\n    .view-btn { color: #9ca3af; }\n    .view-btn:hover { color: #fff; }\n    .view-btn[aria-pressed=\"true\"] { background: var(--accent); color: #fff; box-shadow: 0 0 14px var(--accent-glow); }\n\n    .badge-card.selected {\n        border-color: #00f5d4 !important;\n        background: rgba(0, 245, .5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"/>',\n        ghost: '<path d=\"M9 10h.01\"/><path d=\"M15 10h.01\"/><path d=\"M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z\"/>',\n        star: '<polygon points=\"12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2\"/>',\n        search: '<circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.3-4.3\"/>',\n        plus: '<path d=\"M5 12h14\"/><path d=\"M12 5v14\"/>',\n        grid: '<rect width=\"7\" height=\"7\" x=\"3\" y=\"3\" rx=\"1\"/><rect width=\"7\" height=\"7\" x=\"14\" y=\"3\" rx=\"1\"/><rect width=\"7\" height=\"7\" x=\"14\" y=\"14\" rx=\"1\"/><rect width=\"7\" height=\"7\" x=\"3\" y=\"14\" rx=\"1\"/>',\n        list: '<path d=\"M3 6h.01M3 12h.01M3 18h.01M8 6h13M8 12h13M8 18h13\"/>',\n        rotate: '<path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"/><path d=\"M3 3v5h5\"/>',\n        x: '<path d=\"M18 6 6 18\"/><path d=\"m6 6 12 12\"/>',\n        pen: '<path d=\"M12 20h9\"/><path d=\"M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z\"/>',\n        timer: '<line x1=\"10\" x2=\"14\" y1=\"2\" y2=\"2\"/><line x1=\"12\" x2=\"15\" y1=\"14\" y2=\"11\"/><circle cx=\"12\" cy=\"14\" r=\"8\"/>',\n        info: '<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 16v-4\"/><path d=\"M12 8h.01\"/>',\n        trash: '<path d=\"M3 6h18\"/><path d=\"M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6\"/><path d=\"M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/>',\n        checkSquare: '<polyline points=\"9 11 12 14 22 4\"/><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/>'\n    };\n\n    function svg(name, cls, filled) {\n        const body = ICONS[name] || ICONS.shield;\n        const attrs = filled ? 'fill=\"currentColor\"' : 'fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"';\n        return '<svg class=\"ico ' + (cls || 'w-5 h-5') + '\" viewBox=\"0 0 24 24\" ' + attrs + '>' + body + '<\/svg>';\n    }\n    function hydrateIcons(root) {\n        (root || document).querySelectorAll('[data-icon]').forEach(el => {\n            el.innerHTML = svg(el.dataset.icon, el.dataset.cls, el.dataset.fill === '1');\n        });\n    }\n    function esc(s) {\n        return String(s == null ? '' : s).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n    }\n\n    /* ---------- Data ---------- */\n    const STORE_KEY = 'twitch_badges_v4_img_data';\n    const VIEW_KEY = 'twitch_badges_view_mode';\n    const SAMPLE_BADGE_IMG = 'https://static-cdn.jtvnw.net/badges/v1/5527c58c-fb7d-422d-b71b-f309dcb85601/3';\n\n    const CAT_KEY = 'twitch_badges_categories_v1';\n    const CAT_COLORS = ['#a970ff', '#34d399', '#f59e0b', '#ff007f', '#3a86ff', '#00f5d4', '#ff5c5c', '#f472b6'];\n    function defaultCategories() {\n        return [\n            { id: 'clips', label: '🎬 بادجات كليبات', color: '#a970ff' },\n            { id: 'free', label: '🎁 بادجات مجانية', color: '#34d399' },\n            { id: 'sub', label: '⭐️ اشتراك / إهداء', color: '#f59e0b' },\n            { id: 'custom_streams', label: '🛠️ بادجات مخصصة', color: '#ff007f' }\n        ];\n    }\n    function loadCategories() {\n        try {\n            const raw = localStorage.getItem(CAT_KEY);\n            if (raw) {\n                const parsed = JSON.parse(raw);\n                if (Array.isArray(parsed)) return parsed;\n            }\n        } catch (e) { /* ignore */ }\n        return defaultCategories();\n    }\n    let categories = loadCategories();\n    function saveCategories() {\n        try { localStorage.setItem(CAT_KEY, JSON.stringify(categories)); return true; }\n        catch (e) { toast('تعذر حفظ الفئات: مساحة التخزين ممتلئة.', true); return false; }\n    }\n    const STATUS = {\n        available: { label: 'متاح', cls: 'bg-twitch-neonGreen/10 text-twitch-neonGreen border-twitch-neonGreen/40' },\n        soon: { label: 'قريباً', cls: 'bg-twitch-neonBlue/10 text-twitch-neonBlue border-twitch-neonBlue/40' },\n        unavailable: { label: 'منتهي', cls: 'bg-twitch-neonRed/10 text-twitch-neonRed border-twitch-neonRed/40' }\n    };\n\n    function defaultBadges() {\n        return [\n            { id: '1', title: 'Witcher Drops Badge', code: '#W3H', status: 'available', category: 'custom_streams', gameName: 'The Witcher 3', imageUrl: SAMPLE_BADGE_IMG, reqText: 'مشاهدة 45 دقيقة', description: 'شارة مخصصة رائعة تظهر بوضوح عند رفع رابط صورتها بنفس هذا الأسلوب المطور.', endsAt: null },\n            { id: '2', title: 'شمعة الهالوين', code: '#FREE1', status: 'available', category: 'free', imageUrl: '', reqText: 'مجانية للجميع', description: 'شارة هالوين مخصصة مجانية لجميع المتابعين.', endsAt: null }\n        ];\n    }\n\n    function loadBadges() {\n        try {\n            const raw = localStorage.getItem(STORE_KEY);\n            if (raw) {\n                const parsed = JSON.parse(raw);\n                if (Array.isArray(parsed)) return parsed;\n            }\n        } catch (e) { /* ignore */ }\n        return defaultBadges();\n    }\n\n    function persist() {\n        try {\n            localStorage.setItem(STORE_KEY, JSON.stringify(badges));\n            return true;\n        } catch (e) {\n            toast('تعذر الحفظ: مساحة التخزين ممتلئة. جرّب صورة أصغر أو استخدم رابط صورة.', true);\n            return false;\n        }\n    }\n\n    function categoryTag(id) {\n        const c = categories.find(x => x.id === id) || { label: 'بدون فئة', color: '#9ca3af' };\n        return { label: c.label, style: 'color:' + c.color + ';background:' + c.color + '1a;border-color:' + c.color + '4d' };\n    }\n\n    /* ---------- State ---------- */\n    let badges = loadBadges();\n\n    /* ---------- Managed games list ---------- */\n    const GAME_KEY = 'twitch_badges_games_v1';\n    function loadGames() {\n        try {\n            const raw = localStorage.getItem(GAME_KEY);\n            if (raw) { const p = JSON.parse(raw); if (Array.isArray(p)) return p; }\n        } catch (e) { /* ignore */ }\n        // first run: build the list from games already typed on badges\n        const set = new Set();\n        badges.forEach(b => { if (b.gameName && b.gameName.trim()) set.add(b.gameName.trim()); });\n        return Array.from(set);\n    }\n    let games = loadGames();\n    function saveGames() {\n        try { localStorage.setItem(GAME_KEY, JSON.stringify(games)); return true; }\n        catch (e) { toast('تعذر حفظ الألعاب: مساحة التخزين ممتلئة.', true); return false; }\n    }\n    let selectedBadgeIds = new Set();\n    let isSelectMode = false;\n    let statusFilter = 'all';\n    let categoryFilter = 'all';\n    let gameFilter = 'all';\n    let searchQuery = '';\n    let viewMode = 'grid';\n    try { const v = localStorage.getItem(VIEW_KEY); if (v === 'list' || v === 'grid') viewMode = v; } catch (e) {}\n    let detailId = null;\n    let currentUploadedImg = '';\n    let confirmCallback = null;\n\n    const $ = id => document.getElementById(id);\n\n    /* ---------- Helpers ---------- */\n    let toastTimer = null;\n    function toast(msg, isError) {\n        const t = $('toast');\n        t.textContent = msg;\n        t.classList.toggle('error', !!isError);\n        t.classList.add('show');\n        clearTimeout(toastTimer);\n        toastTimer = setTimeout(() => t.classList.remove('show'), isError ? 4500 : 2200);\n    }\n\n    function renderBadgeImage(url, cls) {\n        if (url && url.trim() !== '') {\n            return '<img data-badge-img=\"' + esc(cls || 'w-10 h-10') + '\" src=\"' + esc(url) + '\" class=\"object-contain drop-shadow-[0_0_8px_rgba(145,71,255,0.6)] ' + (cls || 'w-10 h-10') + '\" alt=\"شارة\" loading=\"lazy\">';\n        }\n        return svg('shield', (cls || 'w-8 h-8') + ' text-twitch-purpleLight');\n    }\n\n    // Fallback when an image URL fails to load\n    document.addEventListener('error', e => {\n        const img = e.target;\n        if (img && img.tagName === 'IMG' && img.dataset.badgeImg) {\n            const holder = document.createElement('span');\n            holder.innerHTML = svg('shield', img.dataset.badgeImg + ' text-twitch-purpleLight');\n            img.replaceWith(holder.firstChild);\n        }\n    }, true);\n\n    function pad(n) { return String(n).padStart(2, '0'); }\n    function formatRemaining(ms) {\n        const s = Math.floor(ms / 1000);\n        const d = Math.floor(s / 86400);\n        const h = Math.floor((s % 86400) / 3600);\n        const m = Math.floor((s % 3600) / 60);\n        const sec = s % 60;\n        return (d > 0 ? d + 'd ' : '') + pad(h) + 'h ' + pad(m) + 'm ' + pad(sec) + 's';\n    }\n    function toLocalInputValue(ts) {\n        const d = new Date(ts);\n        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());\n    }\n\n    /* ---------- Stats ---------- */\n    function updateStats() {\n        const counts = { available: 0, soon: 0, unavailable: 0 };\n        badges.forEach(b => { if (counts[b.status] !== undefined) counts[b.status]++; });\n        ['available', 'soon', 'unavailable'].forEach(k => {\n            $('stat-' + k).textContent = counts[k];\n            $('stat-' + k + '-m').textContent = counts[k];\n        });\n    }\n\n    /* ---------- Filtering ---------- */\n    function getFiltered() {\n        const q = searchQuery.trim().toLowerCase();\n        return badges.filter(b => {\n            if (statusFilter !== 'all' && b.status !== statusFilter) return false;\n            if (categoryFilter !== 'all' && b.category !== categoryFilter) return false;\n            if (gameFilter !== 'all' && (b.gameName || '') !== gameFilter) return false;\n            if (q) {\n                const hay = [b.title, b.code, b.reqText, b.description, b.gameName].join(' ').toLowerCase();\n                if (!hay.includes(q)) return false;\n            }\n            return true;\n        });\n    }\n\n    function updatePressedStates() {\n        document.querySelectorAll('#status-filters [data-status]').forEach(p => p.setAttribute('aria-pressed', String(p.dataset.status === statusFilter)));\n        document.querySelectorAll('#category-pills [data-category]').forEach(p => p.setAttribute('aria-pressed', String(p.dataset.category === categoryFilter)));\n        document.querySelectorAll('#game-pills [data-game]').forEach(p => p.setAttribute('aria-pressed', String(p.dataset.game === gameFilter)));\n        $('view-grid-btn').setAttribute('aria-pressed', String(viewMode === 'grid'));\n        $('view-list-btn').setAttribute('aria-pressed', String(viewMode === 'list'));\n    }\n\n    function renderCategoryPills() {\n        $('category-pills').innerHTML = '<button class=\"pill\" data-category=\"all\" type=\"button\">الكل<\/button>' +\n            categories.map(c => '<button class=\"pill\" data-category=\"' + esc(c.id) + '\" type=\"button\">' + esc(c.label) + '<\/button>').join('');\n    }\n\n    function renderGamePills() {\n        if (gameFilter !== 'all' && !games.includes(gameFilter)) gameFilter = 'all';\n        $('game-pills').innerHTML = '<button class=\"pill\" data-game=\"all\" type=\"button\">الكل<\/button>' +\n            games.map(g => '<button class=\"pill\" data-game=\"' + esc(g) + '\" type=\"button\">🎮 ' + esc(g) + '<\/button>').join('');\n    }\n    function fillGameSelect(current) {\n        const list = games.slice();\n        if (current && !list.includes(current)) list.push(current);\n        $('input-game-name').innerHTML = '<option value=\"\">— بدون لعبة —<\/option>' +\n            list.map(g => '<option value=\"' + esc(g) + '\">' + esc(g) + '<\/option>').join('');\n        $('input-game-name').value = current || '';\n    }\n\n    /* ---------- Rendering ---------- */\n    function timerChip(b) {\n        if (!b.endsAt) return '';\n        return '<span class=\"font-code text-[11px] text-twitch-neonBlue\" dir=\"ltr\" data-card-timer=\"' + esc(b.endsAt) + '\"><\/span>';\n    }\n\n    function gridCard(b) {\n        const st = STATUS[b.status] || STATUS.available;\n        const cat = categoryTag(b.category);\n        const isSelected = selectedBadgeIds.has(b.id);\n\n        return '' +\n        '<div data-open=\"' + esc(b.id) + '\" class=\"badge-card status-' + esc(b.status) + ' ios-glass rounded-3xl p-4 flex flex-col justify-between cursor-pointer relative group ' + (isSelected ? 'selected' : '') + '\">' +\n            (isSelectMode ? '<input type=\"checkbox\" data-select-id=\"' + esc(b.id) + '\" ' + (isSelected ? 'checked' : '') + ' aria-label=\"تحديد\" class=\"absolute top-3 left-3 w-5 h-5 accent-twitch-purple cursor-pointer z-10\">' : '') +\n            '<div>' +\n                '<div class=\"flex items-center justify-between gap-2 mb-3\">' +\n                    '<div class=\"w-14 h-14 bg-black/60 rounded-2xl flex items-center justify-center border border-twitch-purple/30 group-hover:scale-110 transition-transform shadow-badge-glow\">' + renderBadgeImage(b.imageUrl, 'w-10 h-10') + '<\/div>' +\n                    '<div class=\"flex flex-col items-end gap-1\">' +\n                        '<span class=\"px-2.5 py-0.5 rounded-full text-[11px] font-bold border ' + st.cls + '\">' + st.label + '<\/span>' +\n                        '<span class=\"font-code text-xs text-gray-400 bg-black/40 px-2 py-0.5 rounded-md border border-white/10\" dir=\"ltr\">' + esc(b.code) + '<\/span>' +\n                    '<\/div>' +\n                '<\/div>' +\n                '<div class=\"mb-2 flex flex-wrap gap-1.5\"><span class=\"text-[11px] font-bold px-2 py-0.5 rounded-md border\" style=\"' + cat.style + '\">' + esc(cat.label) + '<\/span>' +\n                    (b.gameName ? '<span class=\"text-[11px] font-bold px-2 py-0.5 rounded-md border border-white/15 text-gray-200 bg-white/5\">🎮 ' + esc(b.gameName) + '<\/span>' : '') + '<\/div>' +\n                '<h3 class=\"font-bold text-white text-base mb-1 group-hover:text-twitch-purpleLight transition-colors\">' + esc(b.title) + '<\/h3>' +\n                '<p class=\"text-xs text-gray-400 mb-2 truncate\">' + esc(b.reqText || 'انقر للرؤية والتفاصيل') + '<\/p>' +\n            '<\/div>' +\n            '<div class=\"pt-3 border-t border-white/10 mt-2 flex items-center justify-between text-xs text-gray-400 gap-2\">' +\n                (b.endsAt ? timerChip(b) : '<span class=\"text-[11px]\">انقر للتفاصيل 🔍<\/span>') +\n                '<button type=\"button\" data-edit=\"' + esc(b.id) + '\" aria-label=\"تعديل\" class=\"hover:text-white p-1 rounded-lg hover:bg-white/10\">' + svg('pen', 'w-4 h-4') + '<\/button>' +\n            '<\/div>' +\n        '<\/div>';\n    }\n\n    function listCard(b) {\n        const st = STATUS[b.status] || STATUS.available;\n        const isSelected = selectedBadgeIds.has(b.id);\n        return '' +\n        '<div data-open=\"' + esc(b.id) + '\" class=\"badge-card status-' + esc(b.status) + ' ios-glass rounded-2xl p-3.5 flex items-center justify-between gap-4 cursor-pointer ' + (isSelected ? 'selected' : '') + '\">' +\n            '<div class=\"flex items-center gap-3 min-w-0\">' +\n                (isSelectMode ? '<input type=\"checkbox\" data-select-id=\"' + esc(b.id) + '\" ' + (isSelected ? 'checked' : '') + ' aria-label=\"تحديد\" class=\"w-5 h-5 accent-twitch-purple cursor-pointer\">' : '') +\n                '<div class=\"w-12 h-12 bg-black/50 rounded-xl flex items-center justify-center border border-twitch-purple/30 flex-shrink-0 shadow-md\">' + renderBadgeImage(b.imageUrl, 'w-8 h-8') + '<\/div>' +\n                '<div class=\"min-w-0\">' +\n                    '<h3 class=\"font-bold text-white text-sm truncate\">' + esc(b.title) + '<\/h3>' +\n                    '<div class=\"flex items-center gap-2 flex-wrap\">' +\n                        '<span class=\"font-code text-xs text-gray-400\" dir=\"ltr\">' + esc(b.code) + '<\/span>' +\n                        '<span class=\"px-2 py-0.5 rounded-full text-[10px] font-bold border ' + st.cls + '\">' + st.label + '<\/span>' +\n                        (b.gameName ? '<span class=\"text-[10px] text-gray-300\">🎮 ' + esc(b.gameName) + '<\/span>' : '') +\n                        timerChip(b) +\n                    '<\/div>' +\n                '<\/div>' +\n            '<\/div>' +\n            '<button type=\"button\" data-edit=\"' + esc(b.id) + '\" aria-label=\"تعديل\" class=\"p-1.5 hover:text-white text-gray-400 hover:bg-white/10 rounded-lg\">' + svg('pen', 'w-4 h-4') + '<\/button>' +\n        '<\/div>';\n    }\n\n    function render() {\n        const container = $('badges-container');\n        const empty = $('empty-state');\n        const list = getFiltered();\n\n        updateStats();\n        updatePressedStates();\n        updateBulkBar();\n\n        if (list.length === 0) {\n            container.innerHTML = '';\n            empty.hidden = false;\n            return;\n        }\n        empty.hidden = true;\n\n        container.className = viewMode === 'grid'\n            ? 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5'\n            : 'flex flex-col gap-3.5';\n        container.innerHTML = list.map(b => viewMode === 'grid' ? gridCard(b) : listCard(b)).join('');\n        tickTimers();\n    }\n\n    /* ---------- Timers ---------- */\n    function tickTimers() {\n        const now = Date.now();\n        document.querySelectorAll('[data-card-timer]').forEach(el => {\n            const end = Number(el.dataset.cardTimer);\n            const diff = end - now;\n            if (diff <= 0) { el.textContent = 'انتهى'; el.className = 'font-code text-[11px] text-twitch-neonRed'; }\n            else { el.textContent = '⏳ ' + formatRemaining(diff); el.className = 'font-code text-[11px] text-twitch-neonBlue'; }\n        });\n        if (detailId && !$('badge-detail-modal').hidden) updateDetailTimer();\n    }\n\n    function updateDetailTimer() {\n        const b = badges.find mer();\n        $('badge-detail-modal').dataset.status = b.status;\n        $('badge-detail-modal').hidden = false;\n    }\n    function closeDetail() {\n        $('badge-detail-modal').hidden = true;\n        detailId = null;\n    }\n\n    /* ---------- Add / Edit modal ---------- */\n    function openBadgeModal(b) {\n        $('badge-form').reset();\n        currentUploadedImg = b ? (b.imageUrl && b.imageUrl.startsWith('data:') ? b.imageUrl : '') : '';\n        $('input-category').innerHTML = categories.map(c => '<option value=\"' + c.id + '\">' + c.label + '<\/option>').join('');\n        fillGameSelect(b ? (b.gameName || '') : '');\n        $('badge-id').value = b ? b.id : '';\n        $('modal-title').textContent = b ? 'تعديل الشارة' : 'إضافة شارة جديدة';\n        $('delete-btn').hidden = !b;\n\n        if (b) {\n            $('input-title').value = b.title;\n            $('input-code').value = b.code;\n            $('input-status').value = b.status;\n            $('input-category').value = b.category;\n            $('input-image-url').value = (b.imageUrl && !b.imageUrl.startsWith('data:')) ? b.imageUrl : '';\n            $('input-req-text').value = b.reqText || '';\n            $('input-description').value = b.description || '';\n            $('input-ends').value = b.endsAt ? toLocalInputValue(b.endsAt) : '';\n        }\n\n        updateModalImagePreview();\n        $('badge-modal').hidden = false;\n        setTimeout(() => $('input-title').focus(), 50);\n    }\n    function closeForm() { $('badge-modal').hidden = true; }\n\n    function updateModalImagePreview() {\n        const url = $('input-image-url').value.trim() || currentUploadedImg;\n        $('form-image-preview').innerHTML = renderBadgeImage(url, 'w-12 h-12');\n    }\n\n    // Downscale uploaded images to keep localStorage small\n    function compressImage(file, maxSize) {\n        return new Promise((resolve, reject) => {\n            const reader = new FileReader();\n            reader.onerror = () => reject(new Error('read'));\n            reader.onload = () => {\n                const img = new Image();\n                img.onerror = () => reject(new Error('decode'));\n                img.onload = () => {\n                    const scale = Math.min(1, maxSize / Math.max(img.width, img.height));\n                    const w = Math.max(1, Math.round(img.width * scale));\n                    const h = Math.max(1, Math.round(img.height * scale));\n                    const canvas = document.createElement('canvas');\n                    canvas.width = w; canvas.height = h;\n                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);\n                    resolve(canvas.toDataURL('image/png'));\n                };\n                img.src = reader.result;\n            };\n            reader.readAsDataURL(file);\n        });\n    }\n\n    $('input-image-file').addEventListener('change', async e => {\n        const file = e.target.files[0];\n        if (!file) return;\n        if (!file.type.startsWith('image/')) { toast('الرجاء اختيار ملف صورة صالح.', true); e.target.value = ''; return; }\n        try {\n            currentUploadedImg = await compressImage(file, 256);\n            $('input-image-url').value = '';\n            updateModalImagePreview();\n        } catch (err) {\n            toast('تعذر قراءة الصورة، جرّب ملفاً آخر.', true);\n        }\n        e.target.value = '';\n    });\n\n    $('input-image-url').addEventListener('input', () => {\n        if ($('input-image-url').value.trim()) currentUploadedImg = '';\n        updateModalImagePreview();\n    });\n\n    $('clear-image-btn').addEventListener('click', () => {\n        currentUploadedImg = '';\n        $('input-image-url').value = '';\n        $('input-image-file').value = '';\n        updateModalImagePreview();\n    });\n\n    $('badge-form').addEventListener('submit', e => {\n        e.preventDefault();\n        const id = $('badge-id').value;\n        const url = $('input-image-url').value.trim();\n        if (url && !/^https?:\\/\\//i.test(url)) { toast('رابط الصورة يجب أن يبدأ بـ http:// أو https://', true); return; }\n\n        let code = $('input-code').value.trim();\n        if (code && !code.startsWith('#')) code = '#' + code;\n\n        const endsRaw = $('input-ends').value;\n        const endsAt = endsRaw ? new Date(endsRaw).getTime() : null;\n\n        const data = {\n            id: id || String(Date.now()),\n            title: $('input-title').value.trim(),\n            code: code,\n            status: $('input-status').value,\n            category: $('input-category').value,\n            gameName: $('input-game-name').value.trim(),\n            imageUrl: url || currentUploadedImg,\n            reqText: $('input-req-text').value.trim(),\n            description: $('input-description').value.trim(),\n            endsAt: (endsAt && !isNaN(endsAt)) ? endsAt : null\n        };\n        if (!data.title || !data.code) { toast('الاسم والرمز مطلوبان.', true); return; }\n\n        const prev = badges;\n        badges = id ? badges.map(b => b.id === id ? data : b) : [data].concat(badges);\n\n        if (!persist()) { badges = prev; return; }\n        renderGamePills();\n        render();\n        closeForm();\n        toast(id ? 'تم حفظ التعديلات' : 'تمت إضافة الشارة');\n    });\n\n    /* ---------- Confirm dialog ---------- */\n    function askConfirm(title, text, cb) {\n        $('confirm-title').textContent = title;\n        $('confirm-text').textContent = text;\n        confirmCallback = cb;\n        $('confirm-modal').hidden = false;\n    }\n    function closeConfirm() { $('confirm-modal').hidden = true; confirmCallback = null; }\n    $('confirm-cancel').addEventListener('click', closeConfirm);\n    $('confirm-ok').addEventListener('click', () => {\n        const cb = confirmCallback;\n        closeConfirm();\n        if (cb) cb();\n    });\n\n    function deleteBadges(ids) {\n        const set = new Set(ids);\n        const prev = badges;\n        badges = badges.filter(b => !set.has(b.id));\n        if (!persist()) { badges = prev; return false; }\n        ids.forEach(i => selectedBadgeIds.delete(i));\n        renderGamePills();\n        return true;\n    }\n\n    $('delete-btn').addEventListener('click', () => {\n        const id = $('badge-id').value;\n        if (!id) return;\n        const b = badges.find(x => x.id === id);\n        askConfirm('حذف الشارة', 'سيتم حذف \"' + (b ? b.title : '') + '\" نهائياً. هل أنت متأكد؟', () => {\n            if (deleteBadges([id])) { closeForm(); render(); toast('تم حذف الشارة'); }\n        });\n    });\n\n    /* ---------- Select mode / bulk ---------- */\n    function updateBulkBar() {\n        $('bulk-action-bar').hidden = !isSelectMode;\n        $('selected-count').textContent = selectedBadgeIds.size;\n        $('delete-selected-btn').disabled = selectedBadgeIds.size === 0;\n        const visible = getFiltered();\n        const allSelected = visible.length > 0 && visible.every(b => selectedBadgeIds.has(b.id));\n        $('select-all-btn').textContent = allSelected ? 'إلغاء تحديد الكل' : 'تحديد الكل';\n        $('select-mode-btn-text').textContent = isSelectMode ? 'إنهاء التحديد' : 'تحديد وحذف جماعي';\n    }\n\n    function setSelectMode(on) {\n        isSelectMode = on;\n        if (!on) selectedBadgeIds.clear();\n        render();\n    }\n\n    $('toggle-select-mode-btn').addEventListener('click', () => setSelectMode(!isSelectMode));\n    $('cancel-select-btn').addEventListener('click', () => setSelectMode(false));\n\n    $('select-all-btn').addEventListener('click', () => {\n        const visible = getFiltered();\n        const allSelected = visible.length > 0 && visible.every(b => selectedBadgeIds.has(b.id));\n        visible.forEach(b => allSelected ? selectedBadgeIds.delete(b.id) : selectedBadgeIds.add(b.id));\n        render();\n    });\n\n    $('delete-selected-btn').addEventListener('click', () => {\n        const n = selectedBadgeIds.size;\n        if (!n) return;\n        askConfirm('حذف المحددة', 'سيتم حذف ' + n + ' شارة نهائياً. هل أنت متأكد؟', () => {\n            if (deleteBadges(Array.from(selectedBadgeIds))) {\n                setSelectMode(false);\n                toast('تم حذف ' + n + ' شارة');\n            }\n        });\n    });\n\n    /* ---------- Filters / search / view ---------- */\n    let searchDebounce = null;\n    $('search-input').addEventListener('input', e => {\n        clearTimeout(searchDebounce);\n        searchDebounce = setTimeout(() => { searchQuery = e.target.value; render(); }, 120);\n    });\n\n    $('status-filters').addEventListener('click', e => {\n        const btn = e.target.closest('[data-status]');\n        if (!btn) return;\n        statusFilter = btn.dataset.status;\n        render();\n    });\n    $('category-filters').addEventListener('click', e => {\n        const btn = e.target.closest('[data-category]');\n        if (!btn) return;\n        categoryFilter = btn.dataset.category;\n        render();\n    });\n\n    $('game-filters').addEventListener('click', e => {\n        const btn = e.target.closest('[data-game]');\n        if (!btn) return;\n        gameFilter = btn.dataset.game;\n        render();\n    });\n\n    /* ---------- Games manager ---------- */\n    function renderGamesList() {\n        $('games-list').innerHTML = games.length ? games.map((g, i) => {\n            const count = badges.filter(b => b.gameName === g).length;\n            return '<li class=\"flex items-center justify-between gap-3 bg-black/30 border border-white/10 rounded-2xl px-3 py-2.5\">' +\n                '<div class=\"flex items-center gap-2.5 min-w-0\">' +\n                    '<span>🎮<\/span>' +\n                    '<span class=\"text-sm font-bold text-white truncate\">' + esc(g) + '<\/span>' +\n                    '<span class=\"text-[11px] text-gray-500 font-code\">(' + count + ')<\/span>' +\n                '<\/div>' +\n                '<button type=\"button\" data-del-game=\"' + i + '\" aria-label=\"حذف اللعبة\" class=\"p-1.5 rounded-lg text-twitch-neonRed hover:bg-twitch-neonRed/15\">' + svg('trash', 'w-4 h-4') + '<\/button>' +\n            '<\/li>';\n        }).join('') : '<li class=\"text-xs text-gray-400 text-center py-4\">لا توجد ألعاب. أضف لعبة جديدة من الأعلى.<\/li>';\n    }\n    function openGames() {\n        renderGamesList();\n        $('games-modal').hidden = false;\n        setTimeout(() => $('game-name-new').focus(), 50);\n    }\n    function closeGames() { $('games-modal').hidden = true; }\n    function refreshGameUI() {\n        renderGamePills();\n        if (!$('badge-modal').hidden) fillGameSelect($('input-game-name').value);\n        render();\n    }\n\n    $('manage-games-btn').addEventListener('click', openGames);\n    $('form-manage-games').addEventListener('click', openGames);\n    $('games-close').addEventListener('click', closeGames);\n    $('games-modal').addEventListener('mousedown', e => { if (e.target === e.currentTarget) closeGames(); });\n\n    $('game-form').addEventListener('submit', e => {\n        e.preventDefault();\n        const name = $('game-name-new').value.trim();\n        if (!name) return;\n        if (games.some(g => g.toLowerCase() === name.toLowerCase())) { toast('هذه اللعبة موجودة مسبقاً.', true); return; }\n        const prev = games;\n        games = games.concat([name]);\n        if (!saveGames()) { games = prev; return; }\n        $('game-name-new').value = '';\n        renderGamesList();\n        refreshGameUI();\n        toast('تمت إضافة اللعبة');\n    });\n\n    $('games-list').addEventListener('click', e => {\n        const btn = e.target.closest('[data-del-game]');\n        if (!btn) return;\n        const name = games[Number(btn.dataset.delGame)];\n        if (name === undefined) return;\n        const count = badges.filter(b => b.gameName === name).length;\n        askConfirm('حذف اللعبة', 'سيتم حذف \"' + name + '\"' + (count ? ' وإزالتها من ' + count + ' شارة' : '') + '. هل أنت متأكد؟', () => {\n            const prevG = games, prevB = badges;\n            games = games.filter(g => g !== name);\n            badges = badges.map(b => b.gameName === name ? Object.assign({}, b, { gameName: '' }) : b);\n            if (!saveGames() || !persist()) { games = prevG; badges = prevB; return; }\n            if ($('input-game-name').value === name) $('input-game-name').value = '';\n            renderGamesList();\n            refreshGameUI();\n            toast('تم حذف اللعبة');\n        });\n    });\n\n    /* ---------- Categories manager ---------- */\n    function renderCatsList() {\n        $('cats-list').innerHTML = categories.length ? categories.map(c => {\n            const count = badges.filter(b => b.category === c.id).length;\n            return '<li class=\"flex items-center justify-between gap-3 bg-black/30 border border-white/10 rounded-2xl px-3 py-2.5\">' +\n                '<div class=\"flex items-center gap-2.5 min-w-0\">' +\n                    '<span class=\"w-3.5 h-3.5 rounded-full flex-shrink-0\" style=\"background:' + esc(c.color) + '\"><\/span>' +\n                    '<span class=\"text-sm font-bold text-white truncate\">' + esc(c.label) + '<\/span>' +\n                    '<span class=\"text-[11px] text-gray-500 font-code\">(' + count + ')<\/span>' +\n                '<\/div>' +\n                '<button type=\"button\" data-del-cat=\"' + esc(c.id) + '\" aria-label=\"حذف الفئة\" class=\"p-1.5 rounded-lg text-twitch-neonRed hover:bg-twitch-neonRed/15\">' + svg('trash', 'w-4 h-4') + '<\/button>' +\n            '<\/li>';\n        }).join('') : '<li class=\"text-xs text-gray-400 text-center py-4\">لا توجد فئات. أضف فئة جديدة من الأعلى.<\/li>';\n    }\n    function openCats() {\n        $('cat-color').value = CAT_COLORS[categories.length % CAT_COLORS.length];\n        renderCatsList();\n        $('cats-modal').hidden = false;\n        setTimeout(() => $('cat-name').focus(), 50);\n    }\n    function closeCats() { $('cats-modal').hidden = true; }\n    function refreshCategoryUI() {\n        if (categoryFilter !== 'all' && !categories.some(c => c.id === categoryFilter)) categoryFilter = 'all';\n        renderCategoryPills();\n        render();\n    }\n\n    $('manage-cats-btn').addEventListener('click', openCats);\n    $('cats-close').addEventListener('click', closeCats);\n    $('cats-modal').addEventListener('mousedown', e => { if (e.target === e.currentTarget) closeCats(); });\n\n    $('cat-form').addEventListener('submit', e => {\n        e.preventDefault();\n        const label = $('cat-name').value.trim();\n        if (!label) return;\n        if (categories.some(c => c.label.toLowerCase() === label.toLowerCase())) { toast('هذه الفئة موجودة مسبقاً.', true); return; }\n        const prev = categories;\n        categories = categories.concat([{ id: 'c' + Date.now(), label: label, color: $('cat-color').value || '#a970ff' }]);\n        if (!saveCategories()) { categories = prev; return; }\n        $('cat-name').value = '';\n        $('cat-color').value = CAT_COLORS[categories.length % CAT_COLORS.length];\n        renderCatsList();\n        refreshCategoryUI();\n        toast('تمت إضافة الفئة');\n    });\n\n    $('cats-list').addEventListener('click', e => {\n        const btn = e.target.closest('[data-del-cat]');\n        if (!btn) return;\n        const id = btn.dataset.delCat;\n        const c = categories.find(x => x.id === id);\n        if (!c) return;\n        const count = badges.filter(b => b.category === id).length;\n        askConfirm('حذف الفئة', 'سيتم حذف الفئة \"' + c.label + '\"' + (count ? ' (تحتوي على ' + count + ' شارة ستبقى بدون فئة)' : '') + '. هل أنت متأكد؟', () => {\n            const prev = categories;\n            categories = categories.filter(x => x.id !== id);\n            if (!saveCategories()) { categories = prev; return; }\n            renderCatsList();\n            refreshCategoryUI();\n            toast('تم حذف الفئة');\n        });\n    });\n\n    function setView(mode) {\n        viewMode = mode;\n        try { localStorage.setItem(VIEW_KEY, mode); } catch (e) {}\n        render();\n    }\n    $('view-grid-btn').addEventListener('click', () => setView('grid'));\n    $('view-list-btn').addEventListener('click', () => setView('list'));\n\n    function resetFilters() {\n        statusFilter = 'all';\n        categoryFilter = 'all';\n        gameFilter = 'all';\n        searchQuery = '';\n        $('search-input').value = '';\n        render();\n    }\n    $('reset-btn').addEventListener('click', resetFilters);\n    $('empty-reset').addEventListener('click', resetFilters);\n\n    /* ---------- Card interactions ---------- */\n    $('add-btn').addEventListener('click', () => openBadgeModal(null));\n\n    $('badges-container').addEventListener('click', e => {\n        const edit = e.target.closest('[data-edit]');\n        if (edit) {\n            e.stopPropagation();\n            openBadgeModal(badges.find(x => x.id === edit.dataset.edit));\n            return;\n        }\n        const checkbox = e.target.closest('[data-select-id]');\n        if (checkbox) {\n            e.stopPropagation();\n            const id = checkbox.dataset.selectId;\n            if (checkbox.checked) selectedBadgeIds.add(id); else selectedBadgeIds.delete(id);\n            render();\n            return;\n        }\n        const card = e.target.closest('[data-open]');\n        if (!card) return;\n        const id = card.dataset.open;\n        if (isSelectMode) {\n            if (selectedBadgeIds.has(id)) selectedBadgeIds.delete(id); else selectedBadgeIds.add(id);\n            render();\n        } else {\n            openDetail(id);\n        }\n    });\n\n    /* ---------- Closing modals: buttons, backdrop, Esc ---------- */\n    document.querySelectorAll('[data-close=\"detail\"]').forEach(b => b.addEventListener('click', closeDetail));\n    document.querySelectorAll('[data-close=\"form\"]').forEach(b => b.addEventListener('click', closeForm));\n\n    $ function compute(d){

  const done=ap.filter(([k])=>d.tasks[k]&&d.tasks[k].done).length;
  g.tasks=ap.length?done/ap.length:0;
  t.tasks=taskList().some(([k])=>d.tasks[k]&&(d.tasks[k].done||d.tasks[k].na));
  const mn=Object.values(d.media||{}).filter(v=>String(v)!=='').length;g.study=mn>0?1:0;t.study=mn>0;

function blip(f=660){
  if(!db.settings.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);
    o.connect(g);g.connect(actx.destination);o.start();o.stop(t+.26)}catch{}
}
function fx(k,on){pendingFx={k,on};blip(on?740:420)}
function applyFx(){
  if(!pendingFx)return;const {k,on}=pendingFx;pendingFx=null;
  const el=document.querySelector(`[data-k="${CSS.escape(k)}"]`);if(!el)return;
  const box=el.querySelector('.checkbox')||el,row=el.closest('.task-row,.session');
  const c=on?'fx-on':'fx-off';box.classList.add(c);if(row&&on)row.classList.add('fx-row');
  setTimeout(()=>{box.classList.remove(c);row&&row.classList.remove('fx-row')},800);
}

function monthData(y,m){
  const n=new Date(y,m+1,0).getDate(),out=[];
  for(let i=1;i<=n;i++){const k=`${y}-${pad(m+1)}-${pad(i)}`,d=db.days[k],c=d?compute(d):null;out.push({k,i,d,c,has:!!c&&c.cov>0})}
  return out;
}
function yearRows(y){return Array.from({length:12},(_,m)=>{const ds=monthData(y,m).filter(x=>x.has);return {m,n:ds.length,avg:ds.length?ds.reduce((a,x)=>a+x.c.score,0)/ds.length:0,ml:ds.reduce((a,x)=>a+x.c.ml,0),tr:ds.reduce((a,x)=>a+x.c.trips,0),f:finMonth(y,m)}})}

async function hashPin(p){
  try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('daftar:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch{}
  return 'b:'+btoa(unescape(encodeURIComponent('daftar:'+p)));
}

/* ---------- modal ---------- */
function ask({icon='heart',title,text='',confirm='موافق',cancel='إلغاء',input=null,area=null}){
  return new Promise(res=>{
    const prev=document.activeElement,host=document.createElement('div');host.className='modal-backdrop';
    host.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">${I(icon,34)}<h2 id="mTitle">${esc(title)}</h2>${text?`<p>${esc(text)}</p>`:''}
    ${input?`<label class="field-label" for="mInput">${esc(input.label)}<input id="mInput" type="${input.type||'text'}" ${input.inputmode?`inputmode="${input.inputmode}"`:''} autocomplete="off"></label>`:''}
    ${area?`<label class="field-label" for="mArea">${esc(area.label)}<textarea id="mArea" readonly rows="6" dir="ltr">${esc(area.value)}</textarea></label>`:''}
    <div>${cancel?`<button type="button" class="secondary" data-m="no">${cancel}</button>`:''}<button type="button" class="primary" data-m="yes">${confirm}</button></div></div>`;
    document.body.appendChild(host);
    const done=v=>{document.removeEventListener('keydown',kd,true);host.remove();try{prev&&prev.focus&&prev.focus()}catch{}res(v)};
    const val=()=>input?($('#mInput',host).value):true;
    const kd=e=>{if(e.key==='Escape'){e.preventDefault();done(null)}else if(e.key==='Enter'&&input&&e.target.id==='mInput'){e.preventDefault();done(val())}};
    document.addEventListener('keydown',kd,true);
    host.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b)done(b.dataset.m==='yes'?val():null);else if(e.target===host)done(null)});
    const f=$('#mInput',host)||$('#mArea',host)||$('[data-m="yes"]',host);setTimeout(()=>{f.focus();if(area)f.select()},30);
  });
}

    case 'imgrm':{const k=b.dataset.kind,L=db.settings[k+'s']||[],l=L.find(x=>x.id===b.dataset.id);if(!l)return;const ok=await ask({icon:'trash',title:'حذف هذه الصورة من السجل؟',text:'ما راح تقدر ترجعها بعد الحذف.',confirm:'احذف'});if(!ok)return;db.settings[k+'s']=L.filter(x=>x.id!==l.id);if(db.settings[k]===l.src)delete db.settings[k];db.settings.rev=(db.settings.rev|0)+1;persist();render();return}
    case 'bgapply':db.settings.bgActive=b.dataset.id;persist();applyBg();render();return;
    case 'bgnone':db.settings.bgActive=null;persist();applyBg();render();return;
    case 'bgrm':{const x=(db.settings.bgs||[]).find(v=>v.id===b.dataset.id);if(!x)return;const ok=await ask({icon:'trash',title:'حذف خلفية «'+x.name+'»؟',text:'ما راح تقدر ترجعها بعد الحذف.',confirm:'احذف'});if(!ok)return;db.settings.bgs=db.settings.bgs.filter(v=>v.id!==x.id);if(db.settings.bgActive===x.id)db.settings.bgActive=null;persist();applyBg();render();return}
    case 'ygadd':{const i=$('#ygNew'),v=i?i.value.trim():'';if(!v){i&&i.focus();return}YG().push({id:'y'+uid(),name:v.slice(0,80),done:false,at:null});persist();render();const n=document.querySelector('[data-k="ygnew"]');n&&n.focus();toast('أُضيف الهدف');return}
    case 'ygoal':{const g=YG().find(x=>x.id===b.dataset.id);if(!g)return;g.done=!g.done;g.at=g.done?new Date().toISOString():null;persist();fx(k,g.done);render();toast(g.done?'ما شاء الله، تحقق هدف جديد':'أُلغي تحديد الهدف');return}
    case 'ygrm':db.settings.ygoals=YG().filter(x=>x.id!==b.dataset.id);persist();render();return;
    case 'sttadd':{const i=$('#sTaskNew'),v=i?i.value.trim():'';if(!v){i&&i.focus();return}const L=TL();if(L.length>=20){toast('وصلت للحد الأقصى: 20 عادة');return}L.push(['t'+Date.now().toString(36),v.slice(0,40)]);persist();render();return}
    case 'tmove':{const L=TL(),i=L.findIndex(x=>x[0]===b.dataset.id),j=i+Number(b.dataset.n);if(i<0||j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];persist();render();return}
    case 'scareadd':{const i=$('#sCareNew'),v=i?i.value.trim():'';if(!v){i&&i.focus();return}CL().push({id:'c'+uid(),name:v.slice(0,40)});persist();render();return}
    case 'mmode':mmode=b.dataset.md;enterMode='cards';render();return;
    case 'ymonth':mcur.m=Number(b.dataset.m);mmode='month';enterMode='cards';render();return;
    case 'go':go(b.dataset.v);return;
    case 'sound':db.settings.sound=!db.settings.sound;persist();pendingFx=null;render();blip(660);return;
    case 'today':setDay(todayKey());enterMode='cards';render();return;
    case 'strip':setDay(b.dataset.day);enterMode='cards';render();return;
    case 'dnav':{const dt=parseKey(cursor);dt.setDate(dt.getDate()+Number(b.dataset.n));setDay(key(dt));enterMode='cards';render();return}
    case 'tab':tab=b.dataset.t;enterMode='cards';render();return;
    case 'hideBanner':db.settings.hideBanner=true;persist();render();return;
    case 'task':{const d=D(),t=d.tasks[b.dataset.id]||(d.tasks[b.dataset.id]={});t.done=!t.done;if(t.done){t.na=false;t.at=new Date().toISOString()}else t.at=null;persist();fx(k,t.done);render();{const cc=compute(d),lb=(taskList().find(x=>x[0]===b.dataset.id)||[])[1]||'';toast(t.done?(cc.ap&&cc.done===cc.ap?'اكتملت كل عادات اليوم':`تم: ${lb} · ${cc.done} من ${cc.ap}`):`أُلغيت: ${lb}`)}return}
    case 'na':{const d=D(),t=d.tasks[b.dataset.id]||(d.tasks[b.dataset.id]={});t.na=!t.na;if(t.na){t.done=false;t.at=null}persist();render();return}
    case 'alltasks':{const d=D(),ap=taskList().filter(([id])=>!(d.tasks[id]&&d.tasks[id].na)),all=ap.length&&ap.every(([id])=>d.tasks[id]&&d.tasks[id].done);
      ap.forEach(([id])=>{const t=d.tasks[id]||(d.tasks[id]={});if(all){t.done=false;t.at=null}else if(!t.done){t.done=true;t.at=new Date().toISOString()}});persist();fx(k,!all);render();toast(all?'أُلغي تحديد المهام':'تم تحديد كل المهام');return}
    case 'study':{const s=D().study[Number(b.dataset.i)];s.done=!s.done;s.at=s.done?new Date().toISOString():null;persist();fx(k,s.done);render();toast(s.done?`جلسة ${Number(b.dataset.i)+1} مكتملة`:`أُلغيت جلسة ${Number(b.dataset.i)+1}`);return}
    case 'stype':{const s=D().study[Number(b.dataset.i)];s.type=s.type===b.dataset.t?'':b.dataset.t;persist();render();return}
    case 'cup':{const w=D().water,i=Number(b.dataset.i);let on;
      if(i===w.length){w.pop();on=false}else if(i<w.length){w.length=i;on=false}else{while(w.length<i)w.push(new Date().toISOString());on=true}
      persist();fx(k,on);render();toast(`${w.length} من ${GOALS.water} أكواب · ${w.length*CUP_ML} مل`);return}
    case 'resetwater':D().water=[];persist();render();return;
    case 'wkadd':{D().workouts.push({id:'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:'',link:'',min:'',rounds:''});persist();render();return}
    case 'wkrm':{const d=D();d.workouts=d.workouts.filter(w=>w.id!==b.dataset.id);delete timers[b.dataset.id];persist();render();return}
    case 'wktimer':{const id=b.dataset.id,w=D().workouts.find(x=>x.id===id);if(!w)return;
      if(timers[id]==null){timers[id]=Date.now();blip(740)}else{const m=Math.max(1,Math.round((Date.now()-timers[id])/60000));w.min=(Number(w.min)||0)+m;delete timers[id];persist();blip(520)}
      render();return}
    case 'save':{const d=D();d.savedAt=new Date().toISOString();persist();fx(k,true);render();toast('تم تأكيد حفظ اليوم');return}
    case 'clear':{const ok=await ask({icon:'trash',title:'مسح بيانات هذا اليوم؟',text:'سيُحذف كل ما سجّلته في هذا اليوم ولا يمكن التراجع. نصيحة: حمّل نسخة احتياطية أولاً إن لم تكن متأكداً.',confirm:'امسح اليوم'});
      if(ok){delete db.days[cursor];persist();render()}return}
    case 'taskadd':{const inp=$('#newTask');const v=inp?inp.value.trim():'';if(!v){inp&&inp.focus();return}
      const cur=taskList().slice();if(cur.length>=20){toast('وصلت للحد الأقصى: 20 مهمة');return}
      cur.push(['t'+Date.now().toString(36),v.slice(0,40)]);db.settings.tasks=cur;persist();render();toast('أُضيفت المهمة: '+v.slice(0,40));const n=document.querySelector('[data-k="newtask"]');n&&n.focus();return}
    case 'taskrm':{const lb=(taskList().find(x=>x[0]===b.dataset.id)||[])[1]||'';db.settings.tasks=taskList().filter(x=>x[0]!==b.dataset.id);persist();render();toast('حُذفت المهمة: '+lb);return}
    case 'est':estimate();return;
    case 'estapply':{const d=D();if(d.est){d.kcal=Math.round(d.est.kcal);d.protein=Math.round(d.est.protein);persist();render()}return}
    case 'mnav':{let m=mcur.m+Number(b.dataset.n),y=mcur.y;if(m<0){m=11;y--}if(m>11){m=0;y++}mcur={y,m};enterMode='cards';render();return}
    case 'mday':setDay(b.dataset.day);go('today');return;
    case 'mcsv':doCsv();return;
    case 'export':doExport();return;
    case 'import':doImport();return;
    case 'lock':locked=true;lockErr='';render();return;
    case 'pin':{
      if(db.settings.pin){
        const ok=await ask({icon:'lock',title:'رمز القفل',text:'اكتب رمزاً جديداً من 4 أرقام أو أكثر. اتركه فارغاً لإزالة القفل.',confirm:'حفظ',input:{label:'الرمز الجديد',type:'password',inputmode:'numeric'}});
        if(ok===null)return;const v=String(ok).trim();
        if(!v){db.settings.pin=null;persist();render();return}
        if(!/^\d{4,12}$/.test(v)){await ask({icon:'info',title:'رمز غير صالح',text:'استخدم من 4 إلى 12 رقماً.',confirm:'حسناً',cancel:''});return}
        db.settings.pin=await hashPin(v);persist();render();return;
      }
      const ok=await ask({icon:'lock',title:'قفل الدفتر بالرمز',text:'اختر رمزاً من 4 إلى 12 رقماً. سيُطلب كلما فتحت الصفحة. الرمز يخفي الدفتر فقط وليس تشفيراً للبيانات.',confirm:'تفعيل القفل',input:{label:'الرمز',type:'password',inputmode:'numeric'}});
      if(ok===null)return;const v=String(ok).trim();
      if(!/^\d{4,12}$/.test(v)){await ask({icon:'info',title:'رمز غير صالح',text:'استخدم من 4 إلى 12 رقماً.',confirm:'حسناً',cancel:''});return}
      db.settings.pin=await hashPin(v);persist();render();return;
    }
  }
});
function onField(el,type){
  const f=el.dataset.f;if(!f)return;
  const [a,b,c]=f.split(':');
  if(a==='sidenote'){db.settings.sideNote=el.value;persist();return}
  if(a==='bgdim'){db.settings.bgDim=Math.max(30,Math.min(95,Number(el.value)||70));persist();applyBg();return}
  if(a==='bgquick'){if(type!=='change')return;db.settings.bgActive=el.value||null;persist();applyBg();render();return}
  if(a==='bgname'){const x=(db.settings.bgs||[]).find(v=>v.id===b);if(x){x.name=el.value.slice(0,24)||x.name;persist();if(type==='change')render()}return}
  if(a==='gtarget'){FG().target=Math.max(1,Number(el.value)||10000);persist();if(type==='change')render();return}
  if(a==='nm'){const v=el.value.trim(),N=db.settings.names||(db.settings.names={});if(v)N[b]=v;else delete N[b];persist();if(type==='change'){const sb=$('#sidebar');if(sb)sb.innerHTML=sidebarHTML()}return}
  if(a==='goal'){db.settings[b]=Math.max(0,Number(el.value)||0);persist();live();return}
  if(a==='tname'){const x=TL().find(t=>t[0]===b);if(x){x[1]=el.value.slice(0,40)||x[1];persist()}return}
  if(a==='cname'){const x=CL().find(t=>t.id===b);if(x){x.name=el.value.slice(0,40)||x.name;persist()}return}
  if(a==='navshow'){if(type!=='change')return;let H=db.settings.hideNav||[];H=el.checked?H.filter(t=>t!==b):[...new Set([...H,b])];db.settings.hideNav=H;persist();const sb=$('#sidebar');if(sb)sb.innerHTML=sidebarHTML();return}
  if(a==='mlabel'){const x=ML().find(m=>m[0]===b);if(x){x[1]=el.value;persist()}return}
  if(a==='tabshow'){if(type!=='change')return;let H=db.settings.hideTabs||[];H=el.checked?H.filter(t=>t!==b):[...new Set([...H,b])];if(H.length>=4){el.checked=true;return}db.settings.hideTabs=H;persist();return}
  if(a==='mname'||a==='mkind'||a==='mprog'||a==='mtotal'||a==='mday'||a==='mtime'||a==='mdate'||a==='mrel'){const m=M().find(x=>x.id===b);if(!m)return;
    if(a==='mtotal'){m.total=el.value===''?'':Math.max(0,Number(el.value)||0);persist();if(type==='change')render();return}
    if(a==='mrel'){m.rel=el.value;persist();return}
    if(a==='mday'||a==='mtime'||a==='mdate'){m[a==='mday'?'day':a==='mtime'?'time':'date']=el.value;persist();if(type==='change')render();return}
    if(a==='mname'){m.name=el.value;persist();return}
    if(a==='mkind'){m.kind=el.value;persist();if(type==='change')render();return}
    m.prog=el.value===''?'':Math.max(0,Number(el.value)||0);if(!isFuture(cursor))ensureDay(cursor).media[b]=m.prog;persist();live();if(type==='change')render();return}
  if(isFuture(cursor))return;
  const d=ensureDay(cursor);
  const num=v=>v===''?'':Math.max(0,Number(v)||0);
  if(a==='meal')d.meals[b]=el.value;
  else if(a==='kcal')d.kcal=num(el.value);
  else if(a==='protein')d.protein=num(el.value);
  else if(a==='pray')d.prayers[b]=el.value;
  else if(a==='bed')d.sleep.bed=el.value;
  else if(a==='wake')d.sleep.wake=el.value;
  else if(a==='notes')d.notes=el.value;else if(a==='phone')d.phone=el.value===''?'':Math.max(0,Number(el.value)||0);
  else if(a==='wk'){const w=d.workouts.find(x=>x.id===b);if(!w)return;
    if(c==='min'||c==='rounds')w[c]=num(el.value);else w[c]=el.value;
    if(c==='link'&&type==='change'){persist();render();return}}
  persist();live();
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newTask'){e.preventDefault();const b=$('[data-act="taskadd"]');b&&b.click()}});
document.addEventListener('input',e=>onField(e.target,'input'));
document.addEventListener('change',e=>onField(e.target,'change'));
document.addEventListener('submit',async e=>{
  if(e.target.id!=='lockForm')return;e.preventDefault();
  const v=$('#pinInput').value.trim(),h=await hashPin(v);
  if(h===db.settings.pin){locked=false;lockErr='';render()}else{lockErr='الرمز غير صحيح، حاول مرة أخرى.';render();const i=$('#pinInput');i&&i.focus()}
});
document.addEventListener('click',async e=>{
  if(e.target.id!=='forgot')return;
  const ok=await ask({icon:'trash',title:'مسح الدفتر بالكامل؟',text:'سيُحذف كل ما سجّلته على هذا الجهاز ويُزال القفل. لا يمكن التراجع إلا إن كانت عندك نسخة احتياطية.',confirm:'امسح كل شيء'});
  if(ok){db.days={};db.settings.pin=null;persist();locked=false;render()}
});

/* ---------- boot ---------- */
(()=>{const S=db.settings;let ch=0;
  if(S.logo&&!(S.logos||[]).some(x=>x.src===S.logo)){(S.logos||(S.logos=[])).push({id:'l'+uid(),src:S.logo});ch=1}
  if(S.cover){(S.bgs||(S.bgs=[])).push({id:'b'+uid(),name:'الغلاف السابق',src:S.cover});delete S.cover;ch=1}
  if(ch)persist()})();
route();loadWx();setInterval(loadWx,18e5);setInterval(remind,15000);remind();initPlayer();
(async()=>{
  try{sampleFn=await window.claude?.use?.('sample')}catch{}
  try{dl=await window.claude?.use?.('downloads')}catch{}
  if(sampleFn&&!locked&&view==='day'&&tab==='food')render();
})();
})();
